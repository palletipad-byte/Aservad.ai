<!DOCTYPE html>
<html lang="te">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ఆశీర్వాద్ AI - హోమ్ పేజీ</title>
    <style>
        /* వెబ్‌సైట్ యొక్క రంగులు మరియు డిజైన్ */
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; color: #333; margin: 0; padding: 0; }
        header { background: linear-gradient(135deg, #0f2027, #203a43, #2c5364); color: white; text-align: center; padding: 3rem 1rem; }
        h1 { margin: 0; font-size: 2.8rem; letter-spacing: 1px; }
        p.subtitle { font-size: 1.2rem; margin-top: 10px; color: #a8d5e2; }

        .container { max-width: 1100px; margin: -30px auto 2rem; padding: 0 1rem; position: relative; }

        /* బాక్సులు (Cards) పక్కపక్కన వచ్చేలా సెట్టింగ్ */
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 25px; }

        /* ఒక్కో ఫీచర్ బాక్స్ డిజైన్ */
        .card { background: white; padding: 2rem; border-radius: 15px; box-shadow: 0 10px 20px rgba(0,0,0,0.05); transition: transform 0.3s ease, box-shadow 0.3s ease; }
        .card:hover { transform: translateY(-10px); box-shadow: 0 15px 30px rgba(0,0,0,0.15); }

        .icon { font-size: 3.5rem; margin-bottom: 15px; }
        .card h3 { color: #1a1a1a; margin-bottom: 10px; font-size: 1.4rem; }
        .card p { color: #555; font-size: 1rem; line-height: 1.6; margin-bottom: 20px; }

        /* బటన్ డిజైన్ */
        .btn { background: #203a43; color: white; border: none; padding: 12px 20px; border-radius: 8px; cursor: pointer; font-size: 1rem; font-weight: bold; text-decoration: none; display: inline-block; transition: background 0.3s ease; }
        .btn:hover { background: #00b4db; }
    </style>
</head>
